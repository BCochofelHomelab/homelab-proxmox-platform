name: Task / roadmap item
description: Planned work — new phase item, improvement, or follow-up
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - VMs (platform/, apps/)
        - Ansible
        - Elastic content (shared/, agent-policies/, workspaces/)
        - Terramate
        - CI/CD / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / context
