# mise.toml — the single declaration of this repo's toolchain.
#
#   mise trust && mise install
#
# installs every pinned tool, creates .venv/, and (via the postinstall hook)
# runs `mise run bootstrap`: git hooks, commit template, TFLint plugins and
# the Ansible virtualenv + collections. The same file drives CI through
# jdx/mise-action, so local and CI run identical versions. Versions match
# homelab-proxmox-core's.
#
# Bumping a version: `mise run outdated`, edit the pin below, then `mise lock`
# and commit mise.toml and mise.lock together. CI installs in locked mode
# (MISE_LOCKED=1), so a version change without `mise lock` fails CI. There's
# no Dependabot/Renovate for this file — bumps are deliberate.

[settings]
# Linux only (Ubuntu native or WSL2), see CONTRIBUTING.md.
lockfile_platforms = ["linux-x64"]

[tools]
# Pipeline: OpenTofu stacks, orchestrated by Terramate -> Ansible (in .venv,
# below). No Packer: the VM template is homelab-proxmox-core's.
opentofu       = "1.13.1"
terramate      = "0.17.3"
# Lint / docs
tflint         = "0.64.0"
terraform-docs = "0.24.0"
# Policy as code / security (policies/: homelab-proxmox-core's Proxmox checks)
trivy          = "0.72.0"
"pipx:checkov" = "3.3.22"
gitleaks       = "8.30.1"
shellcheck     = "0.11.0"
# GitHub Actions workflows: actionlint (syntax, expressions, shellcheck on
# run: steps) and zizmor (security: injection, permissions, pinning).
actionlint     = "1.7.12"
zizmor         = "1.30.1"
# Secrets: SOPS + age (the inventory's secrets, .sops.yaml)
sops           = "3.13.3"
age            = "1.3.2"
# Git hooks
"pipx:pre-commit" = "4.6.2"
# GitHub CLI. In the devcontainer it runs as the AI agent's machine user,
# through the wrapper in .devcontainer/bin.
gh             = "2.102.0"
# Runtimes: python for Ansible's .venv (requirements.txt), uv to install
# into it, node so pre-commit's node hooks (commitlint, markdownlint-cli2)
# use this pinned node.
python = "3.14.8"
uv     = "0.12.22"
node   = "24.21.0"
# MCP servers for the AI agent (.mcp.json), all read-only: GitHub, the
# Terraform registry (provider schemas), and Proxmox, which isn't packaged:
# `mise run setup:mcp` pins it instead.
"aqua:github/github-mcp-server"       = "1.14.0"
# HashiCorp ships this one on releases.hashicorp.com, not as GitHub release
# assets, so aqua can't resolve it: plain download, checksum from its
# SHA256SUMS file. Bumping it means updating version, url and checksum.
"http:terraform-mcp-server" = { version = "1.3.0", url = "https://releases.hashicorp.com/terraform-mcp-server/1.3.0/terraform-mcp-server_1.3.0_linux_amd64.zip", checksum = "sha256:f8ecdbfb8473af4d54f6ca428de59649ff4c74f1c8a904da1c2973fa345d4d26" }

[env]
# Never put secrets here. Ansible and ansible-lint live in .venv
# (requirements.txt), NOT as separate pipx tools: ansible-lint must see the
# same ansible-core and collections the playbooks run with.
_.python.venv = { path = ".venv", create = true }

[hooks]
# Runs after every `mise install`. Idempotent, so safe to re-run.
# MISE_SKIP_BOOTSTRAP=1 skips it, for CI jobs that need a single tool.
postinstall = '[ -n "${MISE_SKIP_BOOTSTRAP:-}" ] || mise run bootstrap'

# ---------------------------------------------------------------------------
# Tasks: setup and checks. The credentialed ones (OpenTofu, Ansible) are
# at the bottom; .claude/settings.json denies them to the AI agent.
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "One-time setup after clone (runs automatically after mise install)"
depends = ["setup:hooks", "setup:tflint", "setup:ansible"]
run = "echo 'bootstrap complete'"

[tasks."setup:hooks"]
description = "Install git hooks (pre-commit + commit-msg) and the commit template"
run = [
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
  "git config --local commit.template .gitmessage",
]

[tasks."setup:tflint"]
description = "Download TFLint rulesets declared in .tflint.hcl"
run = "tflint --init --config=.tflint.hcl"

[tasks."setup:ansible"]
description = "Install Ansible into .venv and its Galaxy collections"
run = [
  "uv pip install --quiet -r requirements.txt",
  "cd ansible && ansible-galaxy collection install -r requirements.yml",
]

[tasks."setup:mcp"]
description = "Install the Proxmox MCP server at its pinned commit into ~/.local/share/mcp-proxmox"
shell = "bash -c"
run = '''
set -euo pipefail
# Not published to npm: pin a commit you've reviewed. To bump it, review
# the diff (git -C ~/.local/share/mcp-proxmox log -p <old>..<new>) first.
rev=6186c715b5ff393adc9fdf597a791c35bc2f90c7
dir="$HOME/.local/share/mcp-proxmox"
[ -d "$dir/.git" ] || git clone -q https://github.com/gilby125/mcp-proxmox "$dir"
git -C "$dir" fetch -q origin
git -C "$dir" checkout -q "$rev"
# No package-lock.json upstream, so `npm install`, not `npm ci`.
cd "$dir" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --silent
echo "Proxmox MCP server at $rev in $dir"
# Where the MCP servers write their logs (.mcp.json: terraform-mcp-server --log-file).
mkdir -p "$HOME/.local/state/mcp"
'''

[tasks.lint]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks."lint:secrets"]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["lint", "lint:secrets"]

[tasks.doctor]
description = "Diagnose the local toolchain"
run = ["mise doctor", "mise ls --current"]

[tasks.outdated]
description = "Show which pinned tools and pre-commit hooks could be bumped"
run = ["mise outdated", "pre-commit autoupdate --dry-run || true"]

[tasks."check:boundary"]
description = "Prove the AI agent's boundary using only the ai-agent key: WSL or devcontainer (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
agent="$HOME/.config/sops/age/ai-agent.txt"
ro="$HOME/.secrets/homelab-ro.yaml"
rc=0
ok()   { echo "ok    $1"; }
fail() { echo "FAIL  $1"; rc=1; }
# Only the ai-agent key: an empty HOME hides anything at SOPS's default key path.
as_agent() { HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent "$@"; }

if env | grep -qE '^(PKR_VAR_|TF_VAR_|TF_TOKEN_|PROXMOX_|ELASTICSEARCH_|KIBANA_|GITHUB_PERSONAL)'; then
  fail "credentials are exported into this shell"; else ok "no credentials exported into this shell"; fi

if as_agent sops -d "$ro" >/dev/null 2>&1; then
  ok "ai-agent key opens homelab-ro.yaml"; else fail "ai-agent key can't open homelab-ro.yaml"; fi

for f in "$HOME/.secrets/homelab.yaml" \
         "{{config_root}}"/ansible/inventory/group_vars/*.sops.yaml \
         "{{config_root}}"/ansible/pki/*.sops \
         "{{config_root}}"/ci/*.sops*; do
  case "$f" in *'*'*) continue ;; esac  # a glob that matched nothing
  name=${f#"{{config_root}}/"}; name=${name#"$HOME/"}
  if [ ! -e "$f" ]; then ok "$name not present"
  elif as_agent sops -d "$f" >/dev/null 2>&1; then fail "ai-agent key opens $name"
  else ok "ai-agent key refused by $name"; fi
done

n=$(as_agent sops exec-env "$ro" 'env | grep -c "^TF_"' 2>/dev/null)
if [ "$n" = "0" ]; then ok "homelab-ro.yaml holds no OpenTofu/HCP key"; else fail "homelab-ro.yaml holds TF_* keys (or couldn't be read)"; fi

# A harmless write (create a pool) as ai-agent must be refused.
code=$(as_agent sops exec-env "$ro" 'printf "Authorization: PVEAPIToken=%s!%s=%s\n" "$PROXMOX_USER" "$PROXMOX_TOKEN_NAME" "$PROXMOX_TOKEN_VALUE" | curl -sk -o /dev/null -w "%{http_code}" -H @- -X POST -d poolid=boundary-test "https://$PROXMOX_HOST:$PROXMOX_PORT/api2/json/pools"' 2>/dev/null)
case "$code" in
  403) ok "ai-agent Proxmox token can't write (HTTP 403)" ;;
  200) fail "ai-agent Proxmox token CAN write (HTTP 200): delete pool boundary-test, fix AiAgentRO" ;;
  *)   fail "Proxmox write check inconclusive (HTTP $code)" ;;
esac

if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  fail "a key exists at SOPS's default path ~/.config/sops/age/keys.txt"; else ok "no key at SOPS's default path"; fi

# The AI agent on WSL can write .git/config, and git runs code from some of
# its keys (or redirects remotes, or pulls in other files).
risky=$(git config --local --get-regexp '^(core\.(hookspath|fsmonitor|sshcommand|pager|editor|askpass|gitproxy)|credential\..*|filter\..*|diff\..*|merge\..*\.driver|sequence\.editor|gpg\..*|include\..*|includeif\..*|url\..*|alias\..*)$' |
  awk '$1 !~ /^alias\./ || $2 ~ /^!/ {print $1}' | sort -u | paste -sd' ' -)
[ -z "$risky" ] && ok ".git/config sets nothing that runs code or redirects remotes" ||
  fail ".git/config sets $risky: check them before using git on WSL"

# The machine user is in sre-team: neither may own a path, or its approval would count.
if grep -vE '^\s*(#|$)' "{{config_root}}/.github/CODEOWNERS" | grep -qiE 'bcochofel-ai-agent|sre-team'; then
  fail "CODEOWNERS names bcochofel-ai-agent or sre-team"; else ok "CODEOWNERS names neither bcochofel-ai-agent nor sre-team"; fi

if [ -n "$REMOTE_CONTAINERS" ] || [ -f /.dockerenv ]; then
  echo "== devcontainer"
  [ -e "$HOME/.config/sops/age/bcochofel.txt" ] && fail "your age key is in the container" || ok "your age key isn't in the container"
  [ -e "$HOME/.secrets/homelab.yaml" ] && fail "homelab.yaml is in the container" || ok "homelab.yaml isn't in the container"
  [ -S /var/run/docker.sock ] && fail "the Docker socket is in the container" || ok "no Docker socket"
  if [ -e "$HOME/.config/sops/age/ci.txt" ] || [ -e "${SOPS_AGE_KEY_FILE%/*}/ci.txt" ] || [ -n "$SOPS_AGE_KEY" ]; then
    fail "a ci key is in the container"; else ok "no ci key in the container"; fi
  # By content, not path: devcontainer.json points it at the host-home mount.
  [ -n "$SOPS_AGE_KEY_FILE" ] && cmp -s "$SOPS_AGE_KEY_FILE" "$agent" && ok "SOPS_AGE_KEY_FILE is the ai-agent key" || fail "SOPS_AGE_KEY_FILE isn't the ai-agent key"

  echo "== devcontainer: git and GitHub act as the AI agent"
  if [ -z "$SSH_AUTH_SOCK" ] && ! ssh-add -l >/dev/null 2>&1; then
    ok "no ssh-agent forwarded"; else fail "an ssh-agent is reachable (SSH_AUTH_SOCK=$SSH_AUTH_SOCK)"; fi
  # Any helper other than the agent's would answer for a host that isn't github.com.
  if printf 'protocol=https\nhost=example.com\n\n' |
     GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= SSH_ASKPASS= git credential fill >/dev/null 2>&1; then
    fail "another git credential helper answers (VS Code's?)"; else ok "no git credential helper but the agent's"; fi
  [ "$(git config user.email)" = 340075370+bcochofel-ai-agent@users.noreply.github.com ] &&
    ok "commits are authored by bcochofel-ai-agent" || fail "commit identity is $(git config user.email)"
  [ "$(git config core.hooksPath)" = "{{config_root}}/.devcontainer/git-hooks" ] &&
    ok "git hooks come from .devcontainer/git-hooks" || fail "core.hooksPath isn't .devcontainer/git-hooks"
  # An empty entry resets the list (devcontainer.json's drops VS Code's, from
  # ~/.gitconfig): only the entries after the last one are in effect.
  helpers=$(git config --get-all credential.helper | awk '/^$/ {h = ""; next} {h = h ? h " " $0 : $0} END {print h}')
  [ "$helpers" = "{{config_root}}/.devcontainer/bin/git-credential-ai-agent" ] &&
    ok "the only credential.helper is the agent's" || fail "credential.helper is: ${helpers:-none}"
  # The agent's own WSL clone, never yours: the path inside the mounted filesystem.
  src=$(findmnt -no FSROOT -T "{{config_root}}")
  case "$src" in
    "") fail "can't tell where the working copy is mounted from" ;;
    */Projects/GitHub/BCochofelHomelab/homelab-proxmox-platform) fail "the working copy is your clone, $src" ;;
    *) ok "the working copy isn't your clone (mounted from $src)" ;;
  esac
  for sh in bash zsh; do
    command -v $sh >/dev/null || continue
    [ "$($sh -ic 'command -v gh' 2>/dev/null | tail -1)" = "{{config_root}}/.devcontainer/bin/gh" ] &&
      ok "gh in $sh is the agent's wrapper" || fail "gh in $sh isn't .devcontainer/bin/gh"
  done
  login=$("{{config_root}}/.devcontainer/bin/gh" api user --jq .login 2>/dev/null)
  [ "$login" = bcochofel-ai-agent ] && ok "gh authenticates as bcochofel-ai-agent" || fail "gh authenticates as ${login:-nobody}"
  # A dry-run push authenticates (a fetch from a public repo wouldn't) and sends nothing.
  if git push --dry-run origin HEAD:refs/heads/boundary-check >/dev/null 2>&1; then
    ok "git authenticates to origin over HTTPS with the agent's PAT"; else fail "git can't authenticate to origin"; fi
  repo=$(git remote get-url origin | sed -E 's#^.*github\.com[:/]##; s#\.git$##')
  n=$("{{config_root}}/.devcontainer/bin/gh" api "repos/$repo/rules/branches/main" \
      --jq '[.[] | select(.type == "pull_request") | .parameters | select(.required_approving_review_count >= 1 and .require_code_owner_review)] | length' 2>/dev/null)
  [ "${n:-0}" -ge 1 ] && ok "main requires a code owner's approval, for the agent too" ||
    fail "main's rules for the agent lack a required code-owner approval"
  # A commit that adds a workflow, built without touching the working copy;
  # the PAT has no Workflows permission, so GitHub must refuse it.
  idx=$(mktemp)
  GIT_INDEX_FILE=$idx git read-tree HEAD
  blob=$(echo "# check:boundary" | git hash-object -w --stdin)
  GIT_INDEX_FILE=$idx git update-index --add --cacheinfo "100644,$blob,.github/workflows/boundary-check.yml"
  commit=$(git commit-tree "$(GIT_INDEX_FILE=$idx git write-tree)" -p HEAD -m "check:boundary workflow push")
  rm -f "$idx"
  if out=$(git push origin "$commit:refs/heads/boundary-check-workflows" 2>&1); then
    git push -q origin --delete boundary-check-workflows
    fail "the agent pushed a workflow change (branch deleted): its PAT has the Workflows permission"
  elif echo "$out" | grep -qi workflow; then ok "a push touching .github/workflows/ is refused"
  else fail "workflow push check inconclusive: $(echo "$out" | tail -1)"; fi
fi
exit $rc
'''

# ---------------------------------------------------------------------------
# Credentialed commands: yours only, all denied to the AI agent
# (.claude/settings.json). Your age key lives at
# ~/.config/sops/age/bcochofel.txt, deliberately NOT at SOPS's default
# keys.txt (homelab-proxmox-core, docs/CREDENTIALS.md); each task passes it
# explicitly.
# ---------------------------------------------------------------------------

# OpenTofu, through `terramate run`: every stack under the directory you run
# it from, in order (`after`), each with its own state. From the repo root,
# every stack; from platform/elastic, that one. One sops exec-env holds the
# credentials for the whole run: TF_TOKEN_app_terraform_io (HCP),
# TF_VAR_proxmox_api_token, TF_VAR_cipassword and ELASTICSEARCH_API_KEY.

[tasks."tofu:init"]
description = "tofu init in every stack under the current directory, against HCP Terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'terramate run -- tofu init'"

[tasks."tofu:plan"]
description = "Plan every stack under the current directory, each saved to its tfplan, the one to review before applying (read-write)"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'terramate run -- tofu plan -out=tfplan'"

# Applies each stack's tfplan, saved by tofu:plan: no confirmation prompt,
# and tofu refuses a plan that's stale against the current state.
[tasks."tofu:apply"]
description = "Apply every stack's tfplan under the current directory, saved by tofu:plan (read-write: ~/.secrets/homelab.yaml)"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'terramate run -- tofu apply tfplan'"

# The inventory reads Proxmox with inventory@pve!ansible, whose secret
# (PROXMOX_TOKEN_SECRET) comes from homelab.yaml; Ansible decrypts its own
# group_vars/*.sops.yaml with your key at task time. Extra arguments go to
# ansible-playbook (mise run ansible:site -- --limit elasticsearch --check):
# mise appends them to the last line, the call to `site`, which quotes each
# one with %q. Only when there are some: `printf '%q '` with no arguments
# still prints '', an empty playbook name.
[tasks."ansible:site"]
description = "Configure every platform VM (playbooks/site.yml): the inventory token from ~/.secrets/homelab.yaml, the inventory secrets with your key. Extra args after --"
dir = "{{config_root}}/ansible"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt", ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
shell = "bash -c"
run = '''
site() {
  args=""
  [ $# -eq 0 ] || args=$(printf ' %q' "$@")
  exec sops exec-env ~/.secrets/homelab.yaml "ansible-playbook playbooks/site.yml$args"
}; site'''

# The dry-run, as ci: the CI runner's identity (homelab-proxmox-core's
# runner01, the dry-run environment), shared with you so a dry-run can be
# repeated from your clone, and denied to the AI agent. The ci key comes
# from SOPS_AGE_KEY in CI (the environment's CI_AGE_KEY secret, never
# written to disk) or from its file on your machine. Its credentials are
# ci/dry-run.sops.yaml (you + ci): read-only Proxmox, Elastic and inventory
# tokens, and HCP's team token (an accepted risk, core's docs/CREDENTIALS.md).

# Every stack, in order, as tofu:plan but -refresh=false (refreshing a VM
# needs VM.Config.Disk, a write privilege ci@pve!plan lacks) and never
# saving a plan. --continue-on-error plans every stack and still fails the
# run if one failed; `terramate: Entering stack in /<path>` names each.
[tasks."ci:plan"]
description = "Plan every stack as ci (ci/dry-run.sops.yaml with the ci key), without refreshing; never saves a plan"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
[ -n "$SOPS_AGE_KEY" ] || export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/ci.txt"
exec sops exec-env ci/dry-run.sops.yaml 'terramate run --continue-on-error -- sh -c "tofu init -input=false -no-color >/dev/null && tofu plan -refresh=false -input=false -no-color -lock-timeout=5m"'
'''

# site.yml --check --diff on every platform VM, as ci: the automation SSH
# key (ci/ssh_ed25519.key.sops, core's, decrypted into a temporary
# directory for this run only), the inventory token from
# ci/dry-run.sops.yaml, the inventory secrets with the ci key. Extra args
# go to ansible-playbook, as ansible:site's.
[tasks."ci:check"]
description = "Dry-run site.yml as ci (--check --diff): the ci key, the automation SSH key, the inventory token from ci/dry-run.sops.yaml. Extra args after --"
dir = "{{config_root}}/ansible"
shell = "bash -c"
run = '''
check() {
  set -eo pipefail
  [ -n "$SOPS_AGE_KEY" ] || export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/ci.txt" ANSIBLE_SOPS_AGE_KEYFILE="$HOME/.config/sops/age/ci.txt"
  tmp=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ansible-check.XXXXXX")
  trap 'rm -rf "$tmp"' EXIT
  sops decrypt --input-type binary --output-type binary ../ci/ssh_ed25519.key.sops >"$tmp/ssh_key"
  chmod 600 "$tmp/ssh_key"
  args=""
  [ $# -eq 0 ] || args=$(printf ' %q' "$@")
  ANSIBLE_PRIVATE_KEY_FILE="$tmp/ssh_key" sops exec-env ../ci/dry-run.sops.yaml "ansible-playbook playbooks/site.yml --check --diff$args"
}; check'''

# Read-only, but with your credentials: the inventory token and OpenTofu's
# Elastic API key (the only Elastic key yet), both from homelab.yaml.
# Every VM in Ansible's inventory and every host an agent-policy.yaml lists
# (core's): its agent online in Fleet on its policy, and its host metrics in
# its policy's namespace in Elasticsearch (scripts/check_telemetry.py).
[tasks."check:telemetry"]
description = "Check every host the platform observes (its VMs, core's hosts) reports its telemetry: agent online in Fleet on its policy, recent host metrics in Elasticsearch (read-only; ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/ansible"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'inv=$(ansible-inventory --list) && printf \"%s\" \"$inv\" | python ../scripts/check_telemetry.py --inventory - --policies ../agent-policies --cacert pki/elastic-ca.crt'"

# The internal CA, once: ansible/pki/elastic-ca.crt (commit it) and
# elastic-ca.key.sops, encrypted to your key and the ci key (.sops.yaml).
# The key is generated in memory and piped into SOPS, never written in
# clear. Refuses to replace an existing CA.
[tasks."pki:init"]
description = "Create the internal CA once: ansible/pki/elastic-ca.crt and elastic-ca.key.sops (your key and the ci key)"
dir = "{{config_root}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
shell = "bash -c"
run = '''
set -euo pipefail
crt=ansible/pki/elastic-ca.crt
key=ansible/pki/elastic-ca.key.sops
if [ -e "$crt" ] || [ -e "$key" ]; then
  echo "The CA already exists ($crt, $key): not replacing it." >&2
  exit 1
fi
mkdir -p ansible/pki
trap 'rm -f "$crt" "$key"' ERR
openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 2>/dev/null \
  | sops encrypt --filename-override "$key" > "$key"
openssl req -x509 -new -key <(sops decrypt "$key") -sha256 -days 3650 \
  -subj "/CN=Homelab Platform CA" \
  -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
  -addext "keyUsage=critical,keyCertSign,cRLSign" \
  -out "$crt"
trap - ERR
chmod 0644 "$crt" "$key"
openssl x509 -in "$crt" -noout -subject -enddate -fingerprint -sha256
echo "Commit $crt and $key."
'''

# The client certificate every Elastic Agent presents to Logstash (mTLS):
# Fleet's Logstash output holds one, shared by every agent (shared/fleet).
# Issued once, signed by the internal CA; the key is generated in memory,
# piped into SOPS (your key and the ci key, .sops.yaml) and never written
# in clear. Refuses to replace an existing one: delete both files to renew.
[tasks."pki:agent-client"]
description = "Issue the Elastic Agents' shared Logstash client certificate: ansible/pki/agent-client.crt and agent-client.key.sops"
dir = "{{config_root}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
shell = "bash -c"
run = '''
set -euo pipefail
ca_crt=ansible/pki/elastic-ca.crt
ca_key=ansible/pki/elastic-ca.key.sops
crt=ansible/pki/agent-client.crt
key=ansible/pki/agent-client.key.sops
[ -e "$ca_crt" ] || { echo "No CA: run mise run pki:init first." >&2; exit 1; }
if [ -e "$crt" ] || [ -e "$key" ]; then
  echo "The agent client certificate already exists ($crt, $key): not replacing it." >&2
  exit 1
fi
trap 'rm -f "$crt" "$key"' ERR
# PKCS#8 RSA key, in memory only.
client_key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
printf '%s\n' "$client_key" | sops encrypt --filename-override "$key" > "$key"
openssl x509 -req -sha256 -days 730 \
  -in <(openssl req -new -key <(printf '%s\n' "$client_key") -subj "/CN=elastic-agent") \
  -CA "$ca_crt" -CAkey <(sops decrypt "$ca_key") -set_serial "0x$(openssl rand -hex 16)" \
  -extfile <(printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=clientAuth\n') \
  -out "$crt"
unset client_key
trap - ERR
chmod 0644 "$crt" "$key"
openssl x509 -in "$crt" -noout -subject -issuer -enddate
openssl verify -CAfile "$ca_crt" "$crt"
echo "Commit $crt and $key."
'''

[tasks.sops]
description = "Run sops with your key, from the current directory: mise run sops -- <file> | updatekeys <file>"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"
