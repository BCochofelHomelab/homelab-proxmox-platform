# mise.toml — the single declaration of this repo's toolchain.
#
#   mise trust && mise install
#
# installs every pinned tool, creates .venv/, and (via the postinstall hook)
# runs `mise run bootstrap`: git hooks, commit template,
# TFLint plugins and the Ansible virtualenv + collections. The same file
# drives CI through jdx/mise-action, so local and CI run identical versions.
# Versions match homelab-proxmox-core's mise.toml; bump them together.
#
# Bumping a version: `mise run outdated`, edit the pin below, then `mise lock`
# and commit mise.toml, mise.lock and .mise/locks/ together. CI installs in
# locked mode (MISE_LOCKED=1), so a version change without `mise lock` fails
# CI. There's no Dependabot/Renovate for this file — bumps are deliberate.

[settings]
# Linux only (Ubuntu native or WSL2), see CONTRIBUTING.md.
lockfile_platforms = ["linux-x64"]

[tools]
# Pipeline: OpenTofu stacks orchestrated by Terramate -> Ansible (in .venv,
# below). No Packer: VM templates come from homelab-proxmox-core. No
# Terraform rollback pin: this repo started on OpenTofu.
opentofu       = "1.13.1"
terramate      = "0.17.3"
# Lint / docs
tflint         = "0.64.0"
terraform-docs = "0.24.0"
# Policy as code / security
trivy          = "0.72.0"
gitleaks       = "8.30.1"
shellcheck     = "0.11.0"
# GitHub Actions workflows: actionlint (syntax, expressions, shellcheck on
# run: steps) and zizmor (security: injection, permissions, pinning).
actionlint     = "1.7.12"
zizmor         = "1.30.1"
"pipx:checkov" = "3.3.22"
# Secrets: SOPS + age (homelab-proxmox-core's docs/CREDENTIALS.md)
sops           = "3.13.3"
age            = "1.3.2"
# Git hooks
"pipx:pre-commit" = "4.6.2"
# GitHub CLI. In the devcontainer it runs as the AI agent's machine user,
# through the wrapper in .devcontainer/bin (core's docs/DEVCONTAINER.md).
gh             = "2.102.0"
# Runtimes: python for Ansible's .venv (ansible-core 2.20+, see
# requirements.txt), uv to install into it, node so pre-commit's node hooks
# (commitlint, markdownlint-cli2) use this pinned node.
python = "3.14.8"
uv     = "0.12.22"
node   = "24.21.0"
# MCP servers for the AI agent (.mcp.json, core's docs/CREDENTIALS.md step 8).
# The Proxmox one isn't packaged: `mise run setup:mcp` pins it instead.
"aqua:github/github-mcp-server"       = "1.14.0"
# HashiCorp ships this one on releases.hashicorp.com, not as GitHub release
# assets, so aqua can't resolve it: plain download, checksum from its
# SHA256SUMS file. Bumping it means updating version, url and checksum.
"http:terraform-mcp-server" = { version = "1.3.0", url = "https://releases.hashicorp.com/terraform-mcp-server/1.3.0/terraform-mcp-server_1.3.0_linux_amd64.zip", checksum = "sha256:f8ecdbfb8473af4d54f6ca428de59649ff4c74f1c8a904da1c2973fa345d4d26" }

[env]
# Loaded automatically when you cd into the repo.
# Never put secrets here — see docs/CREDENTIALS.md for how they're passed.
# Ansible and ansible-lint live in .venv (requirements.txt), NOT as separate
# pipx tools: ansible-lint must see the same ansible-core and collections the
# playbooks run with.
_.python.venv = { path = ".venv", create = true }

[hooks]
# Runs after every `mise install`. Idempotent, so safe to re-run.
# MISE_SKIP_BOOTSTRAP=1 skips it, for CI jobs that need a single tool (the
# release workflow only needs node). Without the skip, `mise run bootstrap`
# auto-installs every tool its tasks use, even after `mise install node`.
postinstall = '[ -n "${MISE_SKIP_BOOTSTRAP:-}" ] || mise run bootstrap'

# ---------------------------------------------------------------------------
# Tasks: repo setup and checks, plus the credentialed OpenTofu and Ansible
# commands (bottom of this file).
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "One-time setup after clone (runs automatically after mise install)"
depends = ["setup:hooks", "setup:tflint", "setup:ansible"]
run = "echo 'bootstrap complete'"

[tasks."setup:hooks"]
description = "Install git hooks (pre-commit + commit-msg) and the commit template"
run = [
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
  "git config --local commit.template .gitmessage",
]

[tasks."setup:tflint"]
description = "Download TFLint rulesets declared in .tflint.hcl"
run = "tflint --init --config=.tflint.hcl"

[tasks."setup:ansible"]
description = "Install Ansible into .venv and its Galaxy collections"
run = [
  "uv pip install --quiet -r requirements.txt",
  "cd ansible && ansible-galaxy collection install -r requirements.yml",
]

[tasks."setup:mcp"]
description = "Install the Proxmox MCP server (same pinned commit as homelab-proxmox-core)"
run = "echo 'Run `mise run setup:mcp` in homelab-proxmox-core: both repos share ~/.local/share/mcp-proxmox.'"

[tasks.lint]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks."lint:secrets"]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

[tasks."tm:generate"]
description = "Regenerate every stack's _terramate_*.tf (commit the result)"
run = "terramate generate"

[tasks."tm:check"]
description = "Fail if generated files are stale or Terramate files aren't formatted"
run = [
  "terramate fmt --check",
  "terramate generate --detailed-exit-code",
]

[tasks.contract]
description = "Check the namespace contract: workspace ids, read_from, agent-policy namespaces, package versions"
# The project .venv's Python (PyYAML comes with Ansible), as the pre-commit
# hook uses: plain `python` can resolve to mise's, which has no PyYAML.
run = ".venv/bin/python scripts/check_contract.py"

[tasks.validate]
description = "tofu init -backend=false + validate in every stack (no credentials)"
# The git safeguards stay on for plan and apply (only committed code is
# applied); validating a work in progress is exactly what they'd block.
run = "terramate run --disable-safeguards=git-uncommitted,git-untracked -- sh -c 'tofu init -backend=false -input=false -no-color >/dev/null && tofu validate -no-color'"

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["lint", "lint:secrets", "tm:check", "contract"]

[tasks.doctor]
description = "Diagnose the local toolchain"
run = ["mise doctor", "mise ls --current"]

[tasks.outdated]
description = "Show which pinned tools and pre-commit hooks could be bumped"
run = ["mise outdated", "pre-commit autoupdate --dry-run || true"]

# ---------------------------------------------------------------------------
# Credentialed commands — yours only; all of them are denied to the AI agent
# (.claude/settings.json). Same key handling as homelab-proxmox-core: your
# age key at ~/.config/sops/age/bcochofel.txt, passed explicitly, and
# credentials reach one command through `sops exec-env`, never your shell.
#
#   ~/.secrets/homelab.yaml     read-write: TF_VAR_proxmox_api_token,
#                               TF_VAR_cipassword, TF_TOKEN_app_terraform_io,
#                               ELASTICSEARCH_ENDPOINTS, ELASTICSEARCH_API_KEY,
#                               KIBANA_ENDPOINT, KIBANA_API_KEY
#   ~/.secrets/homelab-ro.yaml  read-only: the Proxmox inventory token
#
# Stacks are selected with TM_SELECT, a Terramate filter. plan and apply
# default to the stacks changed against main (--changed), init to all:
#   TM_SELECT="--tags workspace" mise run tofu:plan
#   TM_SELECT="--chdir workspaces/otel_demo" mise run tofu:plan
# ---------------------------------------------------------------------------

[tasks."tofu:init"]
description = "tofu init in the selected stacks (TM_SELECT, default: all) — read-write: ~/.secrets/homelab.yaml"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab.yaml \"terramate run ${TM_SELECT:-} -- tofu init -input=false\""

[tasks."tofu:plan"]
description = "Plan the selected stacks (TM_SELECT, default: changed vs main), saving each to <stack>/tfplan for review (read-write)"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab.yaml \"terramate run ${TM_SELECT:---changed} -- tofu plan -input=false -out=tfplan\""

# Applies each stack's saved plan, in run order (platform -> shared ->
# agent-policies and workspaces): no prompt, and tofu refuses a stale plan.
[tasks."tofu:apply"]
description = "Apply each selected stack's tfplan (TM_SELECT, default: changed vs main), saved by tofu:plan, in run order (read-write)"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab.yaml \"terramate run ${TM_SELECT:---changed} -- tofu apply -input=false tfplan\""

[tasks."ansible:site"]
description = "Configure every platform VM (playbooks/site.yml), inventory from Proxmox tags; extra ansible-playbook args in ANSIBLE_ARGS"
dir = "{{config_root}}/ansible"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt", ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab-ro.yaml \"ansible-playbook playbooks/site.yml ${ANSIBLE_ARGS:-}\""

[tasks.sops]
description = "Run sops with your key, from the current directory: mise run sops -- <file> | updatekeys <file>"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"
