---
# Host group otel-demo (stacks/agent-policies/agent-policy.tm.hcl). Ansible enrolls its VMs
# into this policy: elastic_agent_policy_id in their group_vars.
name: OpenTelemetry demo VM
description: The otel-demo VM, which runs the demo in Docker Compose
# The agents' own logs and metrics: the platform runs the agents.
namespace: platform
integrations:
  - name: system
    package: system
    # The host belongs to the demo: its logs and metrics are the otel_demo
    # workspace's, while its agent's own telemetry stays the platform's.
    namespace: otel_demo
    description: Host logs and metrics
