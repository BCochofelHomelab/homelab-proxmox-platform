---
# Host group ingest (stacks/agent-policies/agent-policy.tm.hcl). Ansible enrolls its VMs
# into this policy: elastic_agent_policy_id in their group_vars.
name: Ingest
description: "The ingest VM: Logstash and the EDOT Collector gateway"
# The agents' own logs and metrics: the platform runs the agents.
namespace: platform
integrations:
  - name: system
    package: system
    namespace: platform
    description: Host logs and metrics
  # Logstash's monitoring API listens on 127.0.0.1:9600, no auth (the
  # package's default host). The stack-monitoring streams (Kibana's Stack
  # Monitoring) are off by default: on here.
  - name: logstash
    package: logstash
    namespace: platform
    description: Stack monitoring, metrics and logs of Logstash
    inputs:
      logstash-logstash/metrics:
        streams:
          logstash.stack_monitoring.node: {enabled: true}
          logstash.stack_monitoring.node_stats: {enabled: true}
