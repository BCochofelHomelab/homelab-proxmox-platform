---
# Host group elasticsearch (stacks/agent-policies/agent-policy.tm.hcl). Ansible enrolls its VMs
# into this policy: elastic_agent_policy_id in their group_vars.
name: Elasticsearch nodes
description: es-01..es-03
# The agents' own logs and metrics: the platform runs the agents.
namespace: platform
integrations:
  - name: system
    package: system
    namespace: platform
    description: Host logs and metrics
  # Stack monitoring and the node's logs (Kibana's Stack Monitoring):
  # each agent collects its own node (scope: node) over HTTPS, verified
  # against the internal CA, as remote_monitoring_user.
  - name: elasticsearch
    package: elasticsearch
    namespace: platform
    description: Stack monitoring and logs of this Elasticsearch node
    inputs:
      elasticsearch-elasticsearch/metrics:
        vars:
          hosts: ["https://localhost:9200"]
          scope: node
          username: remote_monitoring_user
          password: {secret: remote_monitoring_password}
          ssl: |
            certificate_authorities: ["/etc/elastic-agent/ca.crt"]
