---
# elastic_agent_policy_id: group_vars (the host group's folder name under
# agent-policies/). fleet_url: group_vars/all.yml.
elastic_agent_ca: /etc/elastic-agent/ca.crt
elastic_agent_kibana_url: "https://{{ hostvars[groups['kibana_server'][0]].ansible_host }}:5601"
# Fleet's API is called as elastic, whose password only the Elastic VMs
# hold (group_vars/elastic.sops.yaml): otel-demo uses an Elastic VM's.
elastic_agent_api_password: "{{ hostvars[groups['elastic'][0]].elastic_password }}"

# The tarball the agent is installed from (default, "basic" flavor): the
# stack's version. An agent must not be newer than the stack.
elastic_agent_name: "elastic-agent-{{ elastic_version }}-linux-x86_64"
elastic_agent_url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/{{ elastic_agent_name }}.tar.gz"
elastic_agent_download_dir: /root/elastic-agent-download
