---
# Full provision, after the VM stacks are applied (`mise run tofu:apply`):
# `mise run ansible:site`. Fleet Server waits for shared/fleet (40), and
# each VM's agent for its agent-policies/<group> (50): the first run skips
# them; run this again after applying shared/ and agent-policies/.

# On the CI dry-run runner every job has HOMELAB_DRY_RUN=1 (docs/SETUP.md):
# there, refuse anything but --check. A backstop only, since a pull request
# can remove it; the dry-run environment's approval is the boundary.
- name: Dry-run guard
  hosts: all
  gather_facts: false
  tasks:
    - name: Refuse a real run where HOMELAB_DRY_RUN=1
      ansible.builtin.assert:
        that: ansible_check_mode or lookup('ansible.builtin.env', 'HOMELAB_DRY_RUN') != '1'
        fail_msg: HOMELAB_DRY_RUN=1 (the CI dry-run runner) allows only --check.
        quiet: true
      run_once: true

- name: Bootstrap
  import_playbook: 00-bootstrap.yml
- name: CI dry-run runner's SSH key
  import_playbook: 01-ci-ssh-key.yml
- name: Elasticsearch
  import_playbook: 10-elasticsearch.yml
- name: Kibana
  import_playbook: 20-kibana.yml
- name: Logstash
  import_playbook: 30-logstash.yml
- name: EDOT Collector gateway
  import_playbook: 35-edot-gateway.yml
- name: Fleet Server
  import_playbook: 40-fleet-server.yml
- name: Elastic Agents
  import_playbook: 50-elastic-agents.yml
- name: OpenTelemetry Demo
  import_playbook: 60-otel-demo.yml
- name: Health check
  import_playbook: 99-healthcheck.yml
