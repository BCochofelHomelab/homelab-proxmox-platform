---
# Full provision, after the VM stacks are applied (`mise run tofu:apply`):
# `mise run ansible:site`. Fleet Server waits for shared/fleet (40), and
# each VM's agent for its agent-policies/<group> (50): the first run skips
# them; run this again after applying shared/ and agent-policies/.
- name: Bootstrap
  import_playbook: 00-bootstrap.yml
- name: Elasticsearch
  import_playbook: 10-elasticsearch.yml
- name: Kibana
  import_playbook: 20-kibana.yml
- name: Logstash
  import_playbook: 30-logstash.yml
- name: EDOT Collector gateway
  import_playbook: 35-edot-gateway.yml
- name: Fleet Server
  import_playbook: 40-fleet-server.yml
- name: Elastic Agents
  import_playbook: 50-elastic-agents.yml
- name: OpenTelemetry Demo
  import_playbook: 60-otel-demo.yml
- name: Health check
  import_playbook: 99-healthcheck.yml
