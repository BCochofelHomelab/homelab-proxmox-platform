---
collections:
  - name: community.docker
    version: ">=3.10.0"
  - name: ansible.utils
    version: ">=5.0.0"
  # Vars plugin that decrypts group_vars/*.sops.yaml at task time
  # (ansible.cfg [community.sops] vars_stage = task).
  - name: community.sops
    version: ">=2.0.0"
  # The internal CA (roles/elastic_pki): keys, CSRs, signing.
  - name: community.crypto
    version: ">=3.0.0"
  # data_disk: filesystem; kernel_ipv6: sysctl, and data_disk: mount.
  - name: community.general
    version: ">=11.0.0"
  - name: ansible.posix
    version: ">=2.0.0"
  # The dynamic inventory (inventory/platform.proxmox.yml): Proxmox's VMs,
  # grouped by tag. Needs requests in .venv (requirements.txt).
  - name: community.proxmox
    version: ">=2.0.0"
