---
# Dynamic inventory: Proxmox VMs grouped by their tags. The VM stacks in
# platform/ tag every VM ["terraform", "platform", "<role>"], so the role
# tag is the Ansible group: elasticsearch, kibana, fleet_server, logstash.
#
# Read-only credentials from the environment (the ai-agent@pve token in
# ~/.secrets/homelab-ro.yaml is enough): PROXMOX_URL, PROXMOX_USER,
# PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET.
# TODO(verify): option and environment variable names against the
# community.proxmox.proxmox plugin documentation for the installed version.
plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
# Only VMs this repo manages.
filters:
  - "'platform' in (proxmox_tags_parsed | default([]))"
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: ""
    separator: ""
compose:
  # The guest agent reports the VM's address (enabled by core's VM module).
  ansible_host: (proxmox_agent_interfaces | selectattr('name', 'ne', 'lo') | first)['ip-addresses'][0] | ansible.utils.ipaddr('address')
