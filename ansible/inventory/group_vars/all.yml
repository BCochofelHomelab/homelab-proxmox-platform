---
# Hand-authored, for every platform VM. Secrets live in <group>.sops.yaml,
# one file per group that needs them (`mise run sops -- <file>`).

# homelab-proxmox-core's template: Ubuntu's own Python, named so Ansible
# doesn't guess (and warn) at every run.
ansible_python_interpreter: /usr/bin/python3

# Elastic Stack version, for every DEB package (Elasticsearch, Kibana,
# Logstash) and Elastic Agent tarball (Fleet Server, the EDOT gateway).
# Bump it here and roll out with the playbooks.
elastic_version: "9.5.4"
# Elastic's APT repository for that major version.
elastic_apt_repo: "https://artifacts.elastic.co/packages/{{ elastic_version.split('.')[0] }}.x/apt"

# DNS search domain the VMs get from cloud-init (terramate.tm.hcl).
homelab_domain: homelab.bcochofel.com

# The internal CA for TLS inside the stack: the certificate is committed,
# its key is SOPS-encrypted (your key and the ci key), both created once
# by `mise run pki:init`. Hosts' keys are generated on each host and never
# leave it; only their CSRs are signed on the controller (roles/elastic_pki).
# OpenTofu's Elastic provider verifies against the same certificate
# (terramate.tm.hcl, elastic.ca_cert).
elastic_pki_dir: "{{ playbook_dir }}/../pki"
elastic_ca_cert: "{{ elastic_pki_dir }}/elastic-ca.crt"
elastic_ca_key: "{{ elastic_pki_dir }}/elastic-ca.key.sops"

# Elasticsearch ports, read by every role that talks to the cluster.
es_http_port: 9200
es_transport_port: 9300
# Fleet Server, where every agent enrolls (shared/fleet).
fleet_url: "https://{{ hostvars[groups['fleet_server'][0]].ansible_host }}:8220"

# HTTPS endpoints of every Elasticsearch node.
es_hosts: >-
  {{ groups['elasticsearch'] | map('extract', hostvars, 'ansible_host')
     | map('regex_replace', '^', 'https://')
     | map('regex_replace', '$', ':' ~ es_http_port) | list }}
