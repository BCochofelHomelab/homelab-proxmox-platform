---
# Elasticsearch nodes (hand-authored). Node names and IPs come from Proxmox
# (the inventory, by tag).

es_cluster_name: homelab

# JVM heap: at most 50% of the VM's RAM (8 GB) and under ~31 GB.
es_heap_size: 4g

# The 200 GB data disk (platform/elastic, scsi1) holds path.data.
data_disk_mount_point: /var/lib/elasticsearch

# The host group's Fleet agent policy: agent-policies/elasticsearch.
elastic_agent_policy_id: elasticsearch
