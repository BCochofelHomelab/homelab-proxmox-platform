---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch

  # Markdown linting (markdownlint-cli2, the Node/JS engine — matches the
  # davidanson.vscode-markdownlint VS Code extension already in use here.
  # NOT the Ruby `mdl` gem that Ubuntu's own `markdownlint` apt package
  # installs; that's an unrelated tool with an incompatible config format).
  # Config: .markdownlint.yaml at repo root.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

      # local, not the upstream ansible/ansible-lint hook: that hook manages
      # its own isolated pip env via additional_dependencies, which would
      # duplicate — and drift from — the ansible-core/ansible-lint/collection
      # versions already pinned in requirements.txt and installed into this
      # project's own .venv/ by `mise run setup:ansible`. Runs from ansible/ so
      # ansible.cfg's roles_path and ansible/.ansible-lint both resolve, same
      # as every documented ansible-playbook invocation in this repo.
      # pass_filenames is deliberately false: ansible-lint needs the full
      # role/play context, not individual file fragments (see
      # https://github.com/ansible/ansible-lint/issues/611).
      - id: ansible_lint
        name: ansible-lint (project .venv)
        description: Lints Ansible roles/playbooks with the project's own .venv
        language: system
        entry: bash -c 'cd ansible && ../.venv/bin/ansible-lint'
        files: ^ansible/
        pass_filenames: false

      # Every shell script (by shebang or extension):
      # .devcontainer/post-create.sh, ... Binary pinned in mise.toml, like
      # gitleaks, rather than a separately versioned hook repo.
      - id: shellcheck
        name: shellcheck
        description: Lints shell scripts
        language: system
        entry: shellcheck
        types: [shell]

      # Staged changes only, so it's fast on every commit. The full-history
      # scan is `mise run lint:secrets` (also run by CI). Binary pinned in
      # mise.toml; config and allowlist in .gitleaks.toml.
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false

      # A secret-named OpenTofu variable (token, secret, password, hash,
      # private key, API key) has no default and is sensitive (core's
      # docs/CREDENTIALS.md, "Secret tiers"). Standard library only.
      - id: secret_variables
        name: secret variables have no default and are sensitive
        language: python
        entry: python scripts/check_secret_variables.py
        files: \.tf$

      # mise itself: every workflow's jdx/mise-action step pins the same
      # version as .devcontainer/post-create.sh's MISE_VERSION, so your
      # workstation, the devcontainer and CI run one mise
      # (CONTRIBUTING.md, Toolchain). Standard library only.
      - id: mise_version
        name: mise is pinned to one version everywhere
        language: python
        entry: python scripts/check_mise_version.py
        files: ^(\.devcontainer/post-create\.sh|\.github/workflows/.*\.ya?ml|scripts/check_mise_version\.py)$
        pass_filenames: false

      # Every SOPS file must be committed encrypted. `sops filestatus` reads
      # only the file's metadata: no key and no network, so it gives the
      # same answer on WSL, in the devcontainer, in CI and for the AI agent.
      # gitleaks only catches a decrypted file whose values match a known
      # secret pattern. .sops.yaml is SOPS's (plaintext) configuration.
      - id: sops_encrypted
        name: sops files are encrypted
        language: system
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          sops filestatus "$f" 2>/dev/null | grep -q "\"encrypted\":true"
          || { echo "not SOPS-encrypted: $f"; rc=1; }; done; exit $rc' --
        files: (\.sops\.ya?ml|\.key\.sops)$
        exclude: ^\.sops\.yaml$

      # GitHub Actions workflows. actionlint: syntax, expressions, and
      # shellcheck on run: steps (custom runner labels in
      # .github/actionlint.yaml). zizmor: security (injection, permissions,
      # credentials, unpinned actions); --offline, so no GitHub API calls.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        language: system
        entry: zizmor --offline --no-progress
        files: ^\.github/workflows/.*\.ya?ml$

      # Terramate: formatted, and every stack's generated code up to date
      # (a stale _terramate_*.tf would plan something other than what the
      # configuration says).
      - id: terramate_fmt
        name: terramate fmt --check
        language: system
        entry: terramate fmt --check
        files: \.tm\.hcl$
        pass_filenames: false
      - id: terramate_generate
        name: terramate generated code is up to date
        language: system
        entry: terramate generate --detailed-exit-code
        files: (\.tm\.hcl|workspace\.yaml|agent-policy\.yaml)$
        pass_filenames: false

      # The namespace contract: workspace ids, read_from, agent-policy
      # namespaces and package versions (docs/WORKSPACES.md). Runs with
      # the project .venv's Python (PyYAML).
      - id: namespace_contract
        name: namespace contract (workspaces, agent policies, fleet)
        language: system
        entry: .venv/bin/python scripts/check_contract.py
        files: ^(workspaces|agent-policies|shared/fleet)/|^scripts/check_contract\.py$
        pass_filenames: false

      # A task with `check_mode: false` runs for real in a dry-run
      # (`ansible-playbook --check` on the CI runner), so each one must only
      # read, and say why on the same line: `check_mode: false # read-only: ...`.
      # Lists every one that doesn't, for review (docs/SETUP.md).
      - id: check_mode_false_read_only
        name: check_mode false is marked read-only
        language: pygrep
        entry: 'check_mode:\s*false(?!\s*#\s*read-only:)'
        files: ^ansible/.*\.ya?ml$

  # OpenTofu formatting, validation, linting and scanning of every stack.
  # No terraform-docs: stacks are documented in docs/, not per folder.
  # --tf-path is set per hook, not via the PCT_TFPATH env var: git hooks
  # fired from a shell without `mise activate` (shims only, or an IDE's git
  # UI) never see mise.toml's [env], and would silently fall back to
  # `terraform` — which rewrites the lock files to registry.terraform.io.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      # Terraform formatting
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
          - --args=-no-color
          - --args=-diff
          - --args=-recursive
        files: ^(platform|shared|agent-policies|workspaces|apps)/.*\.tf$

      # Terraform validation
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --args=-json
          - --args=-no-color
        files: ^(platform|shared|agent-policies|workspaces|apps)/.*\.tf$

      # TFLint - Terraform linter
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--call-module-type=all
        files: ^(platform|shared|agent-policies|workspaces|apps)/.*\.tf$

      # Trivy - Security scanner
      - id: terraform_trivy
        args:
          - --args=--config=__GIT_WORKING_DIR__/.trivy.yaml
          - --args=--cache-dir=/tmp/.cache/trivy
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore
        files: ^(platform|shared|agent-policies|workspaces|apps)/.*\.tf$

      # Checkov - Policy as code scanner
      # --external-checks-dir is passed here as an absolute path (not just
      # relied on from checkov.yaml's own relative entry) because this hook
      # cd's into each changed directory before running `checkov -d .` — a
      # relative external-checks-dir would silently resolve to nothing there.
      - id: terraform_checkov
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/checkov.yaml
          - --args=--external-checks-dir=__GIT_WORKING_DIR__/policies/checkov
        files: ^(platform|shared|agent-policies|workspaces|apps)/.*\.tf$

  # Commit message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
