---
# The same hooks as homelab-proxmox-core, minus Packer (the VM template is
# core's), plus Terramate's and the workspace contract's.
# Every hook runs once, at commit. Without this, a hook that names no
# stages also runs at commit-msg, with no files: a second pass that skips
# every file hook and re-runs the always_run ones. commitlint names its own
# stage (commit-msg).
default_stages: [pre-commit]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch

  # Markdown linting (markdownlint-cli2, the Node engine). Config:
  # .markdownlint.yaml at the repo root.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      # local, not the upstream ansible/ansible-lint hook: that hook manages
      # its own isolated pip env via additional_dependencies, which would
      # duplicate — and drift from — the ansible-core/ansible-lint/collection
      # versions already pinned in requirements.txt and installed into this
      # project's own .venv/ by `mise run setup:ansible`. Runs from ansible/ so
      # ansible.cfg's roles_path and ansible/.ansible-lint both resolve, same
      # as every documented ansible-playbook invocation in this repo.
      # pass_filenames is deliberately false: ansible-lint needs the full
      # role/play context, not individual file fragments (see
      # https://github.com/ansible/ansible-lint/issues/611).
      - id: ansible_lint
        name: ansible-lint (project .venv)
        description: Lints Ansible roles/playbooks with the project's own .venv
        language: system
        entry: bash -c 'cd ansible && ../.venv/bin/ansible-lint'
        files: ^ansible/
        pass_filenames: false

      # Every shell script (by shebang or extension). Binary pinned in
      # mise.toml, like gitleaks, rather than a separately versioned hook repo.
      - id: shellcheck
        name: shellcheck
        description: Lints shell scripts
        language: system
        entry: shellcheck
        types: [shell]

      # Staged changes only, so it's fast on every commit. The full-history
      # scan is `mise run lint:secrets` (also run by CI). Binary pinned in
      # mise.toml; config and allowlist in .gitleaks.toml.
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false

      # A secret-named OpenTofu variable (token, secret, password, hash,
      # private key, API key) has no default and is sensitive. Standard
      # library only; names that only look secret are allowlisted in the
      # script, with why.
      - id: secret_variables
        name: secret variables have no default and are sensitive
        language: python
        entry: python scripts/check_secret_variables.py
        files: \.tf$

      # mise itself: every workflow's jdx/mise-action step pins the same
      # version as .devcontainer/post-create.sh's MISE_VERSION, so your
      # workstation, the devcontainer and CI run one mise. Standard library
      # only.
      - id: mise_version
        name: mise is pinned to one version everywhere
        language: python
        entry: python scripts/check_mise_version.py
        files: ^(\.devcontainer/post-create\.sh|\.github/workflows/.*\.ya?ml|scripts/check_mise_version\.py)$
        pass_filenames: false

      # Every SOPS file must be committed encrypted. `sops filestatus` reads
      # only the file's metadata: no key and no network, so it gives the
      # same answer on WSL, in the devcontainer, in CI and for the AI agent.
      # gitleaks only catches a decrypted file whose values match a known
      # secret pattern. .sops.yaml is SOPS's (plaintext) configuration.
      - id: sops_encrypted
        name: sops files are encrypted
        language: system
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          sops filestatus "$f" 2>/dev/null | grep -q "\"encrypted\":true"
          || { echo "not SOPS-encrypted: $f"; rc=1; }; done; exit $rc' --
        files: (\.sops\.ya?ml|\.key\.sops)$
        exclude: ^\.sops\.yaml$

      # GitHub Actions workflows. actionlint: syntax, expressions, and
      # shellcheck on run: steps. zizmor: security (injection, permissions,
      # credentials, unpinned actions); --offline, so no GitHub API calls.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        language: system
        entry: zizmor --offline --no-progress
        files: ^\.github/workflows/.*\.ya?ml$

      # A task with `check_mode: false` runs for real in a dry-run
      # (`ansible-playbook --check` on the CI runner), so each one must only
      # read, and say why on the same line: `check_mode: false # read-only: ...`.
      # Lists every one that doesn't, for review (docs/SETUP.md).
      - id: check_mode_false_read_only
        name: check_mode false is marked read-only
        language: pygrep
        entry: 'check_mode:\s*false(?!\s*#\s*read-only:)'
        files: ^ansible/.*\.ya?ml$

      # Terramate: *.tm.hcl formatted, and every stack's generated code
      # (stacks/**/*.tm.hcl) up to date with its config. Both rewrite the
      # files and fail; stage the result. `generate` also fails a stack
      # that isn't tagged exactly one of "proxmox" or "elastic".
      - id: terramate_fmt
        name: terramate fmt
        language: system
        entry: terramate fmt --detailed-exit-code
        files: \.tm\.hcl$
        pass_filenames: false
      # `run` adds its own check, the one `mise run tofu:*` hits: no stack
      # holds, by hand, a file that some generate block names (even one
      # whose condition is false there). `generate` alone doesn't see it.
      - id: terramate_generate
        name: terramate generate is up to date
        language: system
        entry: bash -c 'terramate generate --detailed-exit-code && terramate run --quiet -- true'
        always_run: true
        pass_filenames: false

      # The contract with terraform-elasticstack-workspace: workspace ids
      # match ^[a-z0-9_]{1,64}$ and aren't "default", and every namespace
      # data is written with names a workspace. PyYAML at ansible-core's
      # version in .venv.
      - id: contract
        name: workspace ids and namespaces
        language: python
        entry: python scripts/check_contract.py
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(stacks/|ansible/inventory/group_vars/|scripts/check_contract\.py$)
        pass_filenames: false

  # OpenTofu formatting, validation, docs, linting and policy, run with
  # `tofu`, on every stack.
  # --tf-path is set per hook, not via the PCT_TFPATH env var: git hooks
  # fired from a shell without `mise activate` never see mise.toml's [env],
  # and would silently fall back to `terraform`.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
          - --args=-no-color
          - --args=-diff
          - --args=-recursive

      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --args=-json
          - --args=-no-color

      # Each stack's README.md: inputs, outputs and providers between
      # terraform-docs' markers.
      - id: terraform_docs
        args:
          - --hook-config=--tf-path=tofu
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--call-module-type=all

      # Trivy - Security scanner
      - id: terraform_trivy
        args:
          - --args=--config=__GIT_WORKING_DIR__/.trivy.yaml
          - --args=--cache-dir=/tmp/.cache/trivy
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore

      # Checkov - Policy as code scanner
      # --external-checks-dir is passed here as an absolute path (not just
      # relied on from checkov.yaml's own relative entry) because this hook
      # cd's into each changed directory before running `checkov -d .` — a
      # relative external-checks-dir would silently resolve to nothing there.
      - id: terraform_checkov
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/checkov.yaml
          - --args=--external-checks-dir=__GIT_WORKING_DIR__/policies/checkov

  # Commit message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
